<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#635BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="900" cy="120" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="logoG" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo tile + T mark -->
  <g transform="translate(80,80)">
    <rect width="120" height="120" rx="26" fill="url(#logoG)"/>
    <path d="M30 41h60v12H68v40H52V53H30z" fill="#2563EB"/>
  </g>

  <!-- Brand wordmark -->
  <text x="220" y="160" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">T-Tech</text>
  <text x="220" y="192" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="20" font-weight="500" fill="#C7D2FE" letter-spacing="0.5">Автоматизация 1С • Казань</text>

  <!-- Headline -->
  <text x="80" y="350" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-2">Автоматизация 1С</text>
  <text x="80" y="430" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-2">под ключ</text>

  <!-- Stat row -->
  <g transform="translate(80,510)" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="0" y="0" font-size="28" font-weight="600" fill="#ffffff">с 2016</text>
    <circle cx="120" cy="-9" r="4" fill="#C7D2FE"/>
    <text x="148" y="0" font-size="28" font-weight="600" fill="#ffffff">300+ клиентов</text>
    <circle cx="406" cy="-9" r="4" fill="#C7D2FE"/>
    <text x="434" y="0" font-size="28" font-weight="600" fill="#ffffff">420 проектов</text>
  </g>
</svg>
